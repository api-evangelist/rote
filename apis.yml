name: Rote
description: >-
  Rote is an AI-native insurance department for auto body shops, backed by Y
  Combinator (Winter 2027 batch). The platform uses AI agents to handle the
  entire negotiation lifecycle between collision-repair shops and insurance
  carriers, autonomously filing and defending claims using technical repair
  data so that shops recover revenue lost to denied or undervalued estimates.
  Founded in San Francisco by Aditya Mittal and Gabriel Castillo, Rote is an
  early-stage company presenting a marketing website only; no public API,
  developer portal, SDK, or OpenAPI surface has been published to date. This
  profile was surfaced as a Y Combinator portfolio lead and enriched from the
  company's public website.
